name: Update Articles Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # 수동 실행 버튼

# 자동 커밋과 GitHub Pages 배포에 필요한 권한
permissions:
  contents: write
  pages: write
  id-token: write

# 이전 실행이 끝나기 전에 다음 실행이 시작되는 것을 방지
concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check API Key
        env:
          THE_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$THE_KEY" ]; then
            echo "CRITICAL ERROR: GEMINI_API_KEY not found in Secrets!"
            exit 1
          else
            echo "API Key found. Length: ${#THE_KEY}"
          fi

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -u scraper.py

      # Git push에 실패하더라도 결과 파일을 Actions 화면에서 받을 수 있도록 보관
      - name: Upload crawled data as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawled-data
          path: |
            articles.json
            logs.json

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions-bot@github.com'
          git add articles.json logs.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📰 자동 업데이트: 기사 목록 갱신"
            git pull --rebase origin main
            git push
          fi

      # GITHUB_TOKEN으로 만든 커밋은 Pages 빌드를 자동으로 시작하지 않으므로
      # 같은 workflow 안에서 사이트 파일을 직접 배포한다.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
